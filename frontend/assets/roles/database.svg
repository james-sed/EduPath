<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Database administrator managing data">
<title>Database administrator managing data</title>
<style>
.bl{animation:blink 5.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.br{animation:breathe 3.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{to{transform:translateY(-2px) scaleY(1.012)}}
.hd{animation:nod 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes nod{0%,100%{transform:rotate(0)}40%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
.ty1{animation:type .42s ease-in-out infinite alternate;transform-box:fill-box}
.ty2{animation:type .42s ease-in-out -.21s infinite alternate;transform-box:fill-box}
@keyframes type{to{transform:translateY(-4px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes bob{to{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.row{animation:row 3.2s ease-in-out infinite}
.r2{animation-delay:.4s}.r3{animation-delay:.8s}.r4{animation-delay:1.2s}.r5{animation-delay:1.6s}
@keyframes row{0%,100%{fill:#dfe3f0}25%{fill:#7fe0a9}}
.disk{animation:disk 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.d2{animation-delay:.6s}.d3{animation-delay:1.2s}
@keyframes disk{to{transform:translateY(-4px)}}
.arr{animation:arr 1.8s ease-in-out infinite}
@keyframes arr{0%{transform:translateY(8px);opacity:0}40%,70%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
</style>
<ellipse cx="205" cy="200" rx="178" ry="150" fill="#ffffff" opacity=".7"/><circle cx="62" cy="96" r="5" fill="#98ded9"/><circle cx="352" cy="78" r="4" fill="#c9c9f6"/><circle cx="360" cy="236" r="6" fill="#7fe0a9" opacity=".7"/>
<g class="arr"><path d="M330 92v-28m-10 10l10-10 10 10" stroke="#0b6560" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
<rect x="30" y="288" width="340" height="12" rx="6" fill="#161d6f"/><rect x="60" y="300" width="10" height="34" rx="4" fill="#0e1350" opacity=".5"/><rect x="330" y="300" width="10" height="34" rx="4" fill="#0e1350" opacity=".5"/>
<g transform="translate(250 120)">
  <g class="disk d1"><path d="M0 0v34c0 10 80 10 80 0v-34" fill="#161d6f"/><ellipse cx="40" cy="0" rx="40" ry="10" fill="#98ded9"/><circle cx="64" cy="22" r="3.5" fill="#c7ffd8"/></g><g class="disk d2"><path d="M0 52v34c0 10 80 10 80 0v-34" fill="#2b3a8f"/><ellipse cx="40" cy="52" rx="40" ry="10" fill="#98ded9"/><circle cx="64" cy="74" r="3.5" fill="#c7ffd8"/></g><g class="disk d3"><path d="M0 104v34c0 10 80 10 80 0v-34" fill="#161d6f"/><ellipse cx="40" cy="104" rx="40" ry="10" fill="#98ded9"/><circle cx="64" cy="126" r="3.5" fill="#c7ffd8"/></g>
</g>
<g>
  <rect x="190" y="210" width="50" height="70" rx="6" fill="#ffffff" stroke="#dfe3f0"/>
  <rect class="row r1" x="197" y="218" width="36" height="7" rx="3" fill="#dfe3f0"/><rect class="row r2" x="197" y="230" width="36" height="7" rx="3" fill="#dfe3f0"/><rect class="row r3" x="197" y="242" width="36" height="7" rx="3" fill="#dfe3f0"/><rect class="row r4" x="197" y="254" width="36" height="7" rx="3" fill="#dfe3f0"/><rect class="row r5" x="197" y="266" width="36" height="7" rx="3" fill="#dfe3f0"/>
</g>

<g class="br">
  <path d="M106 290c0-50 20-78 55-80 35 2 55 30 55 80z" fill="#0b6560"/>
  <path d="M146 211l15 16 15-16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="151" y="190" width="20" height="24" rx="9" fill="#f0c19f"/>
</g>
<g class="hd">
  <circle cx="127" cy="170" r="7" fill="#f0c19f"/>
  <circle cx="161" cy="164" r="35" fill="#f0c19f"/>
  <path d="M122 170c-6-40 18-54 39-53 25-1 44 17 40 52l1 26c-8-4-11-22-14-36-15-8-38-8-54 1-3 13-4 26-12 35z" fill="#5a3825"/>
  <ellipse class="bl" cx="150" cy="168" rx="3.4" ry="4.4" fill="#1f1a3a"/>
  <ellipse class="bl" cx="174" cy="168" rx="3.4" ry="4.4" fill="#1f1a3a"/>
  <circle cx="142" cy="181" r="5.5" fill="#ff9aa8" opacity=".38"/><circle cx="182" cy="181" r="5.5" fill="#ff9aa8" opacity=".38"/>
  <path d="M154 182q8 7 16 0" fill="none" stroke="#1f1a3a" stroke-width="2.6" stroke-linecap="round"/>
  
</g>
<g class="ty1"><path d="M122 236c-10 22-6 40 16 46" stroke="#09524e" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="148" cy="283" r="9" fill="#f0c19f"/></g><g class="ty2"><path d="M200 236c8 22 6 40-8 46" stroke="#09524e" stroke-width="20" stroke-linecap="round" fill="none"/><circle cx="186" cy="283" r="9" fill="#f0c19f"/></g>
</svg>
