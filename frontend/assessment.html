<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill assessment | EduPath</title>
<meta name="description" content="Rate your skills to see which entry-level IT roles fit you.">
<meta name="theme-color" content="#fbfbfd">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="preload" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
</head>
<body>

<header class="nav" aria-label="Site">
  <a href="index.html" class="brand" aria-label="EduPath home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#161d6f"/><path d="M8 22 L14 14 L18 18 L24 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="9" r="2.4" fill="#c7ffd8"/></svg>
    EduPath
  </a>
  <div class="nav-end"><span class="who" data-who></span><button type="button" class="nav-btn" data-signout>Sign Out</button></div>
</header>

<main class="app">
  <div class="wrap">
    <ol class="road" data-road aria-label="Assessment progress"><span class="fill" data-road-fill aria-hidden="true"></span></ol>

    <div class="step-shell">
      <form class="plate step-card" data-assess novalidate>
        <p class="sr-only" aria-live="polite" data-announce></p>
        <div data-panels></div>
        <p class="form-alert" role="alert" data-alert></p>
        <div class="step-actions">
          <button type="button" class="btn btn-ghost" data-back>Back</button>
          <button type="button" class="btn btn-primary has-isle" data-next>Continue <span class="isle" aria-hidden="true"><i class="ph-light ph-arrow-right"></i></span></button>
        </div>
      </form>

      <aside class="plate step-side" aria-hidden="true">
        <div class="cast" data-cast="all" data-cast-static></div>
        <h2 data-side-title></h2>
        <p data-side-text></p>
      </aside>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/cast.js"></script>
<script src="js/assessment.js"></script>
</body>
</html>
